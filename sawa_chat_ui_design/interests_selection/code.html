<!DOCTYPE html><html class="light" lang="en"><head>

<title>Sawa - Interests</title>

                    "surface-container-highest": "#d3e4fe",
                    "on-background": "#0b1c30",
                    "background": "#f8f9ff",
                    "primary-fixed-dim": "#b4c5ff",
                    "secondary-fixed-dim": "#4cd7f6",
                    "on-tertiary": "#ffffff",
                    "on-tertiary-container": "#c1ffc5",
                    "primary": "#004ac6",
                    "inverse-on-surface": "#eaf1ff",
                    "surface-container": "#e5eeff",
                    "secondary-container": "#57dffe",
                    "secondary": "#00687a",
                    "on-primary": "#ffffff",
                    "secondary-fixed": "#acedff",
                    "inverse-primary": "#b4c5ff",
                    "on-primary-fixed": "#00174b",
                    "on-secondary-fixed": "#001f26",
                    "on-error": "#ffffff",
                    "on-tertiary-fixed-variant": "#005321",
                    "on-error-container": "#93000a",
                    "outline-variant": "#c3c6d7",
                    "inverse-surface": "#213145",
                    "surface-tint": "#0053db",
                    "tertiary-container": "#007e37",
                    "on-primary-container": "#eeefff",
                    "surface-container-low": "#eff4ff",
                    "surface-container-lowest": "#ffffff",
                    "error": "#ba1a1a",
                    "on-tertiary-fixed": "#002109",
                    "primary-fixed": "#dbe1ff",
                    "on-primary-fixed-variant": "#003ea8",
                    "on-surface-variant": "#434655",
                    "tertiary": "#006229",
                    "error-container": "#ffdad6",

<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        
        .interest-chip-active {
            @apply bg-primary text-on-primary shadow-lg scale-105;
        }

        .glass-panel {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
        }

        @keyframes subtle-float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-5px); }
            100% { transform: translateY(0px); }
        }
        .float-animation {
            animation: subtle-float 4s ease-in-out infinite;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-background min-h-screen font-body-md overflow-x-hidden">
<!-- Header Navigation (Simplified for Transactional Context) -->
<header class="fixed top-0 left-0 w-full z-50 flex items-center px-container-mobile h-16 bg-surface/80 backdrop-blur-xl transition-opacity">
<button class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-surface-variant/20 transition-colors" onclick="window.history.back()">
<span class="material-symbols-outlined text-primary">arrow_back</span>
</button>
<div class="flex-1 flex justify-center pr-10">
<h1 class="font-title-lg text-title-lg font-bold text-primary">Sawa</h1>
</div>
</header>
<main class="pt-24 pb-32 px-container-mobile max-w-2xl mx-auto">
<!-- Headline Section -->
<section class="mb-stack-gap-lg">
<h2 class="font-headline-lg-mobile text-headline-lg-mobile md:font-headline-lg md:text-headline-lg text-on-surface mb-2">What are you into?</h2>
<p class="font-body-md text-body-md text-outline">Select at least 3 interests to personalize your feed and connect with like-minded people.</p>
</section>
<!-- Dynamic Interest Grid -->
<div class="flex flex-wrap gap-3" id="interest-grid">
<!-- Chips will be rendered here for better maintainability and interaction logic -->
</div>
<!-- Decorative Element -->
<div class="mt-section-margin opacity-30 float-animation pointer-events-none">
<div class="w-64 h-64 bg-gradient-to-br from-primary-container/20 to-secondary-container/20 rounded-full blur-3xl mx-auto"></div>
</div>
</main>
<!-- Fixed Bottom Action Bar -->
<footer class="fixed bottom-0 left-0 w-full p-container-mobile bg-surface/80 backdrop-blur-xl z-50">
<div class="max-w-2xl mx-auto flex flex-col gap-4">
<div class="flex justify-between items-center px-1">
<span class="font-label-md text-label-md text-outline" id="selection-count">0 selected</span>
<button class="font-label-md text-label-md text-primary opacity-0 pointer-events-none transition-all" id="clear-all">Clear all</button>
</div>
<button class="w-full h-14 bg-gradient-to-r from-primary to-primary-container text-on-primary font-title-lg text-title-lg rounded-full shadow-lg shadow-primary/20 flex items-center justify-center gap-2 disabled:opacity-50 disabled:grayscale transition-all active:scale-95" disabled="" id="continue-btn">
                Continue
                <span class="material-symbols-outlined">chevron_right</span>
</button>
<!-- Safe area spacer -->
<div class="h-4"></div>
</div>
</footer>
<script>
        const interests = [
            { id: 'tech', label: 'Technology', icon: 'devices' },
            { id: 'gaming', label: 'Gaming', icon: 'sports_esports' },
            { id: 'sports', label: 'Sports', icon: 'sports_soccer' },
            { id: 'fashion', label: 'Fashion', icon: 'styler' },
            { id: 'music', label: 'Music', icon: 'music_note' },
            { id: 'travel', label: 'Travel', icon: 'flight' },
            { id: 'edu', label: 'Education', icon: 'school' },
            { id: 'biz', label: 'Business', icon: 'work' },
            { id: 'prog', label: 'Programming', icon: 'code' },
            { id: 'photo', label: 'Photography', icon: 'photo_camera' },
            { id: 'food', label: 'Food', icon: 'restaurant' },
            { id: 'movies', label: 'Movies', icon: 'movie' },
            { id: 'science', label: 'Science', icon: 'science' },
            { id: 'shop', label: 'Shopping', icon: 'shopping_bag' },
            { id: 'art', label: 'Art', icon: 'palette' }
        ];

        let selectedInterests = new Set();
        const grid = document.getElementById('interest-grid');
        const continueBtn = document.getElementById('continue-btn');
        const countText = document.getElementById('selection-count');
        const clearBtn = document.getElementById('clear-all');

        function updateUI() {
            const count = selectedInterests.size;
            countText.textContent = `${count} selected`;
            continueBtn.disabled = count < 3;
            
            if (count > 0) {
                clearBtn.classList.remove('opacity-0', 'pointer-events-none');
            } else {
                clearBtn.classList.add('opacity-0', 'pointer-events-none');
            }
        }

        function toggleInterest(id, element) {
            if (selectedInterests.has(id)) {
                selectedInterests.delete(id);
                element.classList.remove('bg-primary', 'text-on-primary', 'shadow-lg', 'scale-105', 'border-primary');
                element.classList.add('bg-surface-container-low', 'text-on-surface-variant', 'border-transparent');
            } else {
                selectedInterests.add(id);
                element.classList.add('bg-primary', 'text-on-primary', 'shadow-lg', 'scale-105', 'border-primary');
                element.classList.remove('bg-surface-container-low', 'text-on-surface-variant', 'border-transparent');
            }
            updateUI();
        }

        interests.forEach(item => {
            const chip = document.createElement('button');
            chip.className = 'flex items-center gap-2 px-6 py-3 rounded-full border-2 border-transparent bg-surface-container-low text-on-surface-variant transition-all duration-300 hover:bg-surface-variant/40 active:scale-90';
            chip.innerHTML = `
                <span class="material-symbols-outlined text-[20px]">${item.icon}</span>
                <span class="font-label-md text-label-md font-semibold">${item.label}</span>
            `;
            chip.onclick = () => toggleInterest(item.id, chip);
            grid.appendChild(chip);
        });

        clearBtn.onclick = () => {
            selectedInterests.clear();
            const chips = grid.querySelectorAll('button');
            chips.forEach(chip => {
                chip.classList.remove('bg-primary', 'text-on-primary', 'shadow-lg', 'scale-105', 'border-primary');
                chip.classList.add('bg-surface-container-low', 'text-on-surface-variant', 'border-transparent');
            });
            updateUI();
        };

        continueBtn.onclick = () => {
            // Success animation
            continueBtn.innerHTML = '<span class="material-symbols-outlined animate-spin">sync</span>';
            setTimeout(() => {
                alert('Profile updated with ' + Array.from(selectedInterests).length + ' interests!');
                window.location.reload();
            }, 1000);
        };
    </script>
<!-- Visual Polish: Mesh Gradient Background -->
<div class="fixed inset-0 -z-10 overflow-hidden pointer-events-none">
<div class="absolute -top-[20%] -left-[10%] w-[50%] h-[50%] rounded-full bg-primary-fixed-dim/10 blur-[100px]"></div>
<div class="absolute -bottom-[20%] -right-[10%] w-[60%] h-[60%] rounded-full bg-secondary-fixed-dim/10 blur-[120px]"></div>
</div>
</body></html>
