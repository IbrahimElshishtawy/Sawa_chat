<script>
        // Emoji Reaction System
        const reactionTrigger = document.getElementById('reaction-trigger');
        const emojiCanvas = document.getElementById('emoji-canvas');
        const emojis = ['❤️', '🔥', '👏', '🙌', '✨', '🤩', '🚀', '💯'];

        function spawnEmoji() {
            const emoji = document.createElement('div');
            emoji.className = 'emoji-animation text-2xl';
            emoji.innerText = emojis[Math.floor(Math.random() * emojis.length)];
            
            // Randomize position slightly
            const randomX = Math.random() * 60 - 30; // -30px to +30px
            emoji.style.right = (20 + randomX) + 'px';
            
            emojiCanvas.appendChild(emoji);
            
            // Clean up
            setTimeout(() => {
                emoji.remove();
            }, 2500);
        }

        reactionTrigger.addEventListener('click', () => {
            // Spawn multiple emojis on click
            for(let i=0; i<5; i++) {
                setTimeout(spawnEmoji, i * 100);
            }
        });

        // Simulate incoming chat messages
        const chatContainer = document.getElementById('chat-container');
        const userNames = ['Aria_Stream', 'Neo_Gamer', 'TechGuru', 'PixelArt', 'DesignLover'];
        const messages = ['WOW!', 'Incredible!', 'Where is this?', 'Link in bio?', 'Subscribed! ✅', 'Love the mood!'];

        function addMessage() {
            const msgDiv = document.createElement('div');
            msgDiv.className = 'flex items-start gap-2 animate-pulse';
            msgDiv.innerHTML = `
                <div class="glass-panel px-3 py-2 rounded-2xl rounded-tl-none inline-block">
                    <span class="text-secondary-fixed-dim font-bold text-[13px]">${userNames[Math.floor(Math.random() * userNames.length)]}:</span>
                    <span class="text-white text-[13px]">${messages[Math.floor(Math.random() * messages.length)]}</span>
                </div>
            `;
            chatContainer.insertBefore(msgDiv, chatContainer.firstChild);
            
            // Limit messages to avoid performance issues
            if (chatContainer.children.length > 20) {
                chatContainer.lastElementChild.remove();
            }
            
            // Remove pulse animation after intro
            setTimeout(() => { msgDiv.classList.remove('animate-pulse'); }, 1000);
        }

        setInterval(() => {
            if (Math.random() > 0.6) addMessage();
        }, 3000);

        // Auto-spawn occasional emojis to simulate live environment
        setInterval(() => {
            if (Math.random() > 0.8) spawnEmoji();
        }, 1500);
    </script>
