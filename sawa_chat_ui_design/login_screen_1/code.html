<style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8f9ff;
            min-height: 100vh;
        }

        .bg-pattern {
            background-image: url('https://lh3.googleusercontent.com/aida/AP1WRLsqJHZUgyWMUMwX4S_99mMgWmcbTz_rm8zzOyWmKekeW8FLPEOygfIyW-7D97KWvvALdM7yptUghwivMn1Bv4wM-3yy0fNwiqNYCfRI_BO3SbmwFf1Z3ByQl0WVHwsoydUFte97ZbOGYVeSF94RjPC2Pcq1Bn6CW8vSW875J0xZGPYudztSTXAqzTaQcXuK9aIoQpADFnbq5LH81Qbt5HzkMDPxFnmkeTP6BdlAPZYL-EDE3Klol2tIRw');
            background-size: cover;
            background-position: center;
            opacity: 0.12;
            mix-blend-mode: multiply;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.5);
        }

        .floating-label-input:focus-within label,
        .floating-label-input input:not(:placeholder-shown) + label {
            transform: translateY(-24px) scale(0.85);
            color: #004ac6;
        }

        .social-btn {
            background: rgba(255, 255, 255, 0.9);
            border: 1px solid rgba(0, 0, 0, 0.08);
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .social-btn:active {
            transform: scale(0.98);
            background: rgba(255, 255, 255, 1);
        }

        .login-btn {
            background: linear-gradient(135deg, #2563eb 0%, #004ac6 100%);
            box-shadow: 0 8px 20px -6px rgba(37, 99, 235, 0.4);
        }
    </style>
</head>
<body class="flex flex-col items-center justify-center p-6 relative overflow-hidden">
<!-- Subtle Background Pattern -->
<div class="fixed inset-0 bg-pattern pointer-events-none"></div>
<div class="fixed inset-0 bg-gradient-to-br from-surface-container-low via-surface-bright to-white pointer-events-none"></div>
<div class="w-full max-w-[400px] relative z-10 flex flex-col items-center">
<!-- Header -->
<header class="text-center mb-10 animate-in fade-in slide-in-from-top-4 duration-700">
<div class="mb-6 inline-block">
<img alt="Sawa Chat Logo" class="w-20 h-20 rounded-2xl shadow-xl" src="https://lh3.googleusercontent.com/aida/AP1WRLt_84KzMoWJdYwMlQ0RBrQDVS-h231q-cVqo6Ac7XAvSERjp0ZZd2RuquAnDPd8K6RnNYebMd97jjo-wBuLOZ_tqQei8Kaki0pL1qfXlVjXtGnrra7QBUAqQOZZn-IxY1NwA3LU_iL1qIUipC0zXojjXCEiyEDUWeLjVPuVFgFB6bNPYMSeTWtOWLUP_fEVwft7ROVi3UylJiDWYYw0Vda-_nS2Gypqake9aRC7efFoQpzvDY4WM_wCqFk"/>
</div>
<h1 class="text-headline-lg-mobile text-on-surface mb-2 font-bold">Welcome Back</h1>
<p class="text-on-surface-variant text-body-md opacity-70">Log in to continue your conversations</p>
</header>
<!-- Login Form -->
<main class="w-full space-y-6">
<form class="space-y-5">
<!-- Email/Phone Field -->
<div class="relative floating-label-input group">
<input class="block w-full px-4 pt-6 pb-2 text-on-surface bg-surface-container-lowest border-0 border-b-2 border-outline-variant focus:border-primary focus:ring-0 rounded-t-xl transition-all peer" id="username" placeholder=" " type="text"/>
<label class="absolute left-4 top-4 text-on-surface-variant opacity-60 transition-all pointer-events-none origin-left" for="username">Email or Phone</label>
</div>
<!-- Password Field -->
<div class="relative group">
<div class="relative floating-label-input">
<input class="block w-full px-4 pt-6 pb-2 text-on-surface bg-surface-container-lowest border-0 border-b-2 border-outline-variant focus:border-primary focus:ring-0 rounded-t-xl transition-all peer" id="password" placeholder=" " type="password"/>
<label class="absolute left-4 top-4 text-on-surface-variant opacity-60 transition-all pointer-events-none origin-left" for="password">Password</label>
</div>
<button class="absolute right-3 bottom-2 text-on-surface-variant hover:text-primary transition-colors" type="button">
<span class="material-symbols-outlined text-[20px]">visibility</span>
</button>
</div>
<!-- Forgot Password -->
<div class="flex justify-end px-1">
<a class="text-label-md font-semibold text-primary hover:text-primary-fixed-dim transition-colors" href="#">Forgot Password?</a>
</div>
<!-- Login Button -->
<button class="login-btn w-full py-4 rounded-2xl text-white font-bold text-body-lg flex items-center justify-center gap-2 group" type="submit">
<span>Login</span>
<span class="material-symbols-outlined text-xl transition-transform group-hover:translate-x-1">arrow_forward</span>
</button>
</form>
<!-- Divider -->
<div class="relative flex items-center py-2">
<div class="flex-grow border-t border-outline-variant"></div>
<span class="flex-shrink mx-4 text-label-sm text-on-surface-variant opacity-40 uppercase tracking-widest">or continue with</span>
<div class="flex-grow border-t border-outline-variant"></div>
</div>
<!-- Social Logins -->
<div class="space-y-3">
<button class="social-btn w-full flex items-center justify-center gap-3 py-3.5 rounded-2xl text-on-surface font-medium text-body-md">
<svg class="w-5 h-5" viewbox="0 0 24 24">
<path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"></path>
<path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"></path>
<path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z" fill="#FBBC05"></path>
<path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 12-4.53z" fill="#EA4335"></path>
</svg>
                    Google
                </button>
<button class="social-btn w-full flex items-center justify-center gap-3 py-3.5 rounded-2xl text-on-surface font-medium text-body-md">
<svg class="w-5 h-5 fill-current" viewbox="0 0 24 24">
<path d="M12.152 6.896c-.948 0-2.415-1.078-3.96-1.04-2.04.027-3.91 1.183-4.961 3.014-2.117 3.675-.546 9.103 1.519 12.09 1.013 1.454 2.208 3.09 3.792 3.03 1.52-.065 2.09-.987 3.935-.987 1.831 0 2.35.987 3.96.948 1.637-.026 2.676-1.48 3.676-2.948 1.156-1.688 1.636-3.325 1.662-3.415-.039-.013-3.182-1.221-3.22-4.857-.026-3.04 2.48-4.494 2.597-4.559-1.429-2.09-3.623-2.324-4.39-2.376-2.044-.147-3.049.377-4.01.377zm3.611-3.931c.857-1.039 1.43-2.48 1.272-3.922-1.234.052-2.729.818-3.612 1.857-.793.922-1.482 2.389-1.298 3.792 1.376.104 2.78-.688 3.638-1.727z"></path>
</svg>
                    Apple
                </button>
<button class="social-btn w-full flex items-center justify-center gap-3 py-3.5 rounded-2xl text-on-surface font-medium text-body-md">
<svg class="w-5 h-5 text-[#1877F2] fill-current" viewbox="0 0 24 24">
<path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.469h3.047V9.43c0-3.007 1.791-4.667 4.532-4.667 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.469h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"></path>
</svg>
                    Facebook
                </button>
</div>
<!-- Guest Login -->
<div class="text-center pt-2">
<a class="text-label-md text-on-surface-variant hover:text-primary transition-colors underline-offset-4 hover:underline" href="#">Continue as Guest</a>
</div>
</main>
<!-- Footer -->
<footer class="mt-auto pt-10 pb-4 text-center">
<p class="text-body-md text-on-surface-variant opacity-80">
                Don't have an account? 
                <a class="text-primary font-bold hover:underline underline-offset-4 ml-1" href="#">Create Account</a>
</p>
</footer>
</div>
<!-- Background Elements -->
<div class="fixed top-[-10%] right-[-10%] w-[40%] h-[40%] bg-primary-container/10 blur-[100px] rounded-full"></div>
<div class="fixed bottom-[-5%] left-[-10%] w-[30%] h-[30%] bg-secondary-container/10 blur-[80px] rounded-full"></div>
</body></html>
