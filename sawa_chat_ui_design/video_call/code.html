</div>
</div>
</div>
<div class="flex items-center gap-4">

</div>
</div>

<span class="material-symbols-outlined text-[18px] text-tertiary-fixed-dim">signal_cellular_alt</span>
<span class="text-label-sm">High Quality Connection</span>
</div>
</div>
<!-- MICRO INTERACTIONS SCRIPT -->
<script>
        // Toggle Mic UI
        const micBtn = document.getElementById('mic-toggle');
        let micActive = true;
        micBtn.addEventListener('click', () => {
            micActive = !micActive;
            const icon = micBtn.querySelector('.material-symbols-outlined');
            if (micActive) {
                icon.textContent = 'mic';
                micBtn.classList.replace('bg-white/10', 'bg-white/10');
                micBtn.classList.remove('bg-error/20', 'border-error/40');
            } else {
                icon.textContent = 'mic_off';
                micBtn.classList.add('bg-error/20', 'border-error/40');
            }
        });

        // Toggle Camera UI
        const camBtn = document.getElementById('camera-toggle');
        let camActive = true;
        camBtn.addEventListener('click', () => {
            camActive = !camActive;
            const icon = camBtn.querySelector('.material-symbols-outlined');
            if (camActive) {
                icon.textContent = 'videocam';
                camBtn.classList.replace('bg-white/10', 'bg-white');
                icon.classList.replace('text-white', 'text-on-background');
            } else {
                icon.textContent = 'videocam_off';
                camBtn.classList.replace('bg-white', 'bg-white/10');
                icon.classList.replace('text-on-background', 'text-white');
            }
        });

        // Simple animation for chat bubbles appearance
        document.querySelectorAll('.animate-fade-in-up').forEach((el, index) => {
            el.style.opacity = '0';
            el.style.transform = 'translateY(10px)';
            setTimeout(() => {
                el.style.transition = 'all 0.5s ease-out';
                el.style.opacity = '1';
                el.style.transform = 'translateY(0)';
            }, 500 + (index * 200));
        });
    </script>
