<script>
        // Micro-interactions for generator
        document.querySelectorAll('button').forEach(btn => {
            btn.addEventListener('click', function() {
                if (this.innerText === 'Generate Creation') {
                    const originalText = this.innerHTML;
                    this.innerHTML = '<span class="material-symbols-outlined animate-spin">sync</span> Thinking...';
                    this.disabled = true;
                    setTimeout(() => {
                        this.innerHTML = originalText;
                        this.disabled = false;
                    }, 3000);
                }
            });
        });

        // Simple Style Selection Logic
        const styleButtons = document.querySelectorAll('button.group');
        styleButtons.forEach(btn => {
            btn.addEventListener('click', () => {
                styleButtons.forEach(b => {
                    const div = b.querySelector('div');
                    const span = b.querySelector('span:last-child');
                    div.classList.remove('bg-primary', 'text-white', 'ring-4', 'ring-primary/20', 'shadow-lg');
                    div.classList.add('bg-surface-container-highest', 'text-on-surface-variant');
                    span.classList.remove('text-primary', 'font-bold');
                    span.classList.add('text-on-surface-variant');
                });
                const div = btn.querySelector('div');
                const span = btn.querySelector('span:last-child');
                div.classList.add('bg-primary', 'text-white', 'ring-4', 'ring-primary/20', 'shadow-lg');
                div.classList.remove('bg-surface-container-highest', 'text-on-surface-variant');
                span.classList.add('text-primary', 'font-bold');
                span.classList.remove('text-on-surface-variant');
            });
        });
    </script>
