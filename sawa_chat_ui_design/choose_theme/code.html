                        "on-primary-container": "#eeefff",

                        "error": "#ba1a1a",

<style>
    body {
      min-height: max(884px, 100dvh);
    }

<body class="bg-surface text-on-surface font-body-md min-h-screen flex flex-col items-center justify-center p-container-mobile antialiased">
<!-- Header Section (Suppressed Shell for focused task) -->
<header class="w-full max-w-lg mb-stack-gap-lg text-center">
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface mb-2">Choose Theme</h1>
<p class="font-body-md text-body-md text-outline">Personalize your experience with Sawa's visual style.</p>
</header>
<!-- Theme Selection Grid -->
<main class="w-full max-w-lg flex flex-col gap-6">
<div class="grid grid-cols-1 md:grid-cols-3 gap-4 h-[400px] md:h-[480px]">
<!-- Light Theme Card -->
<button class="theme-card relative group bg-surface-container-lowest border-2 border-outline-variant rounded-[32px] p-4 flex flex-col items-center transition-all duration-300 hover:shadow-xl active:scale-95" id="theme-light" onclick="selectTheme('light')">
<div class="w-full h-full rounded-[24px] bg-white overflow-hidden shadow-inner flex flex-col mb-4">
<!-- Mini Preview Light -->
<div class="h-8 bg-blue-50 w-full flex items-center px-3 gap-2">
<div class="w-2 h-2 rounded-full bg-blue-600"></div>
<div class="w-12 h-1 bg-blue-200 rounded"></div>
</div>
<div class="p-3 space-y-2">
<div class="flex gap-2 items-center">
<div class="w-6 h-6 rounded-full bg-slate-100"></div>
<div class="flex-1 h-3 bg-slate-50 rounded"></div>
</div>
<div class="w-3/4 h-2 bg-slate-100 rounded"></div>
<div class="w-1/2 h-2 bg-slate-100 rounded"></div>
<div class="w-full h-20 bg-blue-50 rounded-xl mt-4"></div>
</div>
</div>
<div class="flex items-center justify-between w-full px-2">
<span class="font-title-lg text-title-lg">Light</span>
<div class="checkmark hidden w-6 h-6 bg-primary-container text-on-primary-container rounded-full flex items-center justify-center">
<span class="material-symbols-outlined !text-[16px]" style="font-variation-settings: 'wght' 700">check</span>
</div>
</div>
</button>
<!-- Dark Theme Card -->
<button class="theme-card relative group bg-inverse-surface border-2 border-outline-variant rounded-[32px] p-4 flex flex-col items-center transition-all duration-300 hover:shadow-xl active:scale-95" id="theme-dark" onclick="selectTheme('dark')">
<div class="w-full h-full rounded-[24px] bg-slate-900 overflow-hidden shadow-inner flex flex-col mb-4">
<!-- Mini Preview Dark -->
<div class="h-8 bg-slate-800 w-full flex items-center px-3 gap-2">
<div class="w-2 h-2 rounded-full bg-blue-400"></div>
<div class="w-12 h-1 bg-slate-700 rounded"></div>
</div>
<div class="p-3 space-y-2">
<div class="flex gap-2 items-center">
<div class="w-6 h-6 rounded-full bg-slate-800"></div>
<div class="flex-1 h-3 bg-slate-800 rounded"></div>
</div>
<div class="w-3/4 h-2 bg-slate-800 rounded"></div>
<div class="w-1/2 h-2 bg-slate-800 rounded"></div>
<div class="w-full h-20 bg-slate-800 rounded-xl mt-4"></div>
</div>
</div>
<div class="flex items-center justify-between w-full px-2">
<span class="font-title-lg text-title-lg text-white">Dark</span>
<div class="checkmark hidden w-6 h-6 bg-primary-container text-on-primary-container rounded-full flex items-center justify-center">
<span class="material-symbols-outlined !text-[16px]" style="font-variation-settings: 'wght' 700">check</span>
</div>
</div>
</button>
<!-- System Theme Card -->
<button class="theme-card active-theme-card relative group bg-surface-container-high border-2 border-outline-variant rounded-[32px] p-4 flex flex-col items-center transition-all duration-300 hover:shadow-xl active:scale-95" id="theme-system" onclick="selectTheme('system')">
<div class="w-full h-full rounded-[24px] overflow-hidden shadow-inner flex flex-col mb-4 relative">
<!-- Split Preview System -->
<div class="absolute inset-0 flex">
<div class="w-1/2 h-full bg-white flex flex-col">
<div class="h-8 bg-blue-50 w-full"></div>
<div class="p-2 space-y-2">
<div class="w-full h-2 bg-slate-100 rounded"></div>
<div class="w-full h-8 bg-blue-50 rounded mt-2"></div>
</div>
</div>
<div class="w-1/2 h-full bg-slate-900 flex flex-col border-l border-slate-700">
<div class="h-8 bg-slate-800 w-full"></div>
<div class="p-2 space-y-2">
<div class="w-full h-2 bg-slate-800 rounded"></div>
<div class="w-full h-8 bg-slate-800 rounded mt-2"></div>
</div>
</div>
</div>
<div class="absolute inset-0 flex items-center justify-center">
<div class="px-2 py-1 bg-primary text-on-primary rounded-full text-[8px] font-bold uppercase tracking-wider">Auto</div>
</div>
</div>
<div class="flex items-center justify-between w-full px-2">
<span class="font-title-lg text-title-lg">System</span>
<div class="checkmark w-6 h-6 bg-primary-container text-on-primary-container rounded-full flex items-center justify-center">
<span class="material-symbols-outlined !text-[16px]" style="font-variation-settings: 'wght' 700">check</span>
</div>
</div>
</button>
</div>
<!-- Footer Action -->
<div class="mt-8">
<button class="w-full h-14 bg-gradient-to-r from-primary to-secondary text-on-primary font-title-lg text-title-lg rounded-full shadow-lg shadow-primary/20 hover:scale-[1.02] active:scale-[0.98] transition-all flex items-center justify-center gap-2">
                Continue
                <span class="material-symbols-outlined">arrow_forward</span>
</button>
<p class="text-center mt-6 font-label-md text-label-md text-outline">
                You can change this anytime in <span class="font-semibold">Settings</span>
</p>
</div>
</main>
<script>
        function selectTheme(themeId) {
            // Remove active classes from all cards
            const cards = document.querySelectorAll('.theme-card');
            cards.forEach(card => {
                card.classList.remove('active-theme-card');
                card.querySelector('.checkmark').classList.add('hidden');
                card.querySelector('.checkmark').classList.remove('flex');
            });

            // Add active class to selected card
            const selectedCard = document.getElementById(`theme-${themeId}`);
            selectedCard.classList.add('active-theme-card');
            const checkmark = selectedCard.querySelector('.checkmark');
            checkmark.classList.remove('hidden');
            checkmark.classList.add('flex');

            // Apply theme change for visual feedback
            const body = document.body;
            if (themeId === 'dark') {
                document.documentElement.classList.add('dark');
                body.classList.remove('bg-surface');
                body.classList.add('bg-slate-950');
            } else if (themeId === 'light') {
                document.documentElement.classList.remove('dark');
                body.classList.add('bg-surface');
                body.classList.remove('bg-slate-950');
            } else {
                // System - Defaulting to light for this demo
                document.documentElement.classList.remove('dark');
                body.classList.add('bg-surface');
                body.classList.remove('bg-slate-950');
            }
        }

        // Initialize with 'system' as default based on the visual starting state
        selectTheme('system');
    </script>
</body></html>
