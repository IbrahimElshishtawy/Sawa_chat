<script>
        // Micro-interaction for tab switching
        const tabs = document.querySelectorAll('nav button');
        tabs.forEach(tab => {
            tab.addEventListener('click', () => {
                tabs.forEach(t => {
                    t.classList.remove('bg-primary', 'text-on-primary', 'shadow-md', 'shadow-primary/20');
                    t.classList.add('bg-surface-container-highest', 'text-on-surface-variant');
                });
                tab.classList.add('bg-primary', 'text-on-primary', 'shadow-md', 'shadow-primary/20');
                tab.classList.remove('bg-surface-container-highest', 'text-on-surface-variant');
            });
        });

        // Basic image lazy loading observation (aesthetic simulation)
        const galleryItems = document.querySelectorAll('.masonry-item');
        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    entry.target.classList.add('translate-y-0', 'opacity-100');
                    entry.target.classList.remove('translate-y-4', 'opacity-0');
                }
            });
        }, { threshold: 0.1 });

        galleryItems.forEach(item => {
            item.classList.add('translate-y-4', 'opacity-0', 'transition-all', 'duration-700');
            observer.observe(item);
        });
    </script>
