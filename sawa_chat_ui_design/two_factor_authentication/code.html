<body class="bg-surface text-on-surface font-body-md selection:bg-primary/20">
<!-- TopAppBar (Suppressed navigation labels for transactional focus) -->

</div>

<main class="min-h-screen pt-24 pb-12 px-container-mobile flex flex-col items-center">
<!-- Content Container -->
<div class="w-full max-w-md space-y-8">
<!-- Header Section -->
<section class="text-center space-y-3">
<div class="inline-flex items-center justify-center w-20 h-20 rounded-3xl bg-primary-container/10 mb-2 relative">

<span class="material-symbols-outlined text-primary text-4xl relative z-10" style="font-variation-settings: 'wght' 300;">lock_person</span>
</div>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-on-background">Security Verification</h1>
<p class="font-body-md text-body-md text-on-surface-variant max-w-[280px] mx-auto">Choose a verification method to continue to your account.</p>
</section>
<!-- Security Level Indicator -->
<div class="glass-card p-4 rounded-2xl border border-outline-variant/30 flex items-center justify-between">
<div class="flex items-center gap-3">
<div class="relative w-10 h-10 flex items-center justify-center">
<svg class="w-full h-full -rotate-90">
<circle class="text-outline-variant/20" cx="20" cy="20" fill="none" r="18" stroke="currentColor" stroke-width="3"></circle>
<circle class="text-tertiary transition-all duration-1000" cx="20" cy="20" fill="none" r="18" stroke="currentColor" stroke-dasharray="113" stroke-dashoffset="28" stroke-width="3"></circle>
</svg>
<span class="absolute text-[10px] font-bold text-tertiary">75%</span>
</div>
<div>
<p class="font-label-md text-label-md text-on-surface">Account Security</p>
<p class="font-label-sm text-label-sm text-tertiary font-bold">HIGH LEVEL</p>
</div>
</div>
<button class="text-primary font-label-md text-label-md hover:underline">Tips</button>
</div>
<!-- Method Selection -->
<div class="space-y-3" id="method-selector">
<label class="block font-label-sm text-label-sm text-outline uppercase tracking-wider mb-1">Select Method</label>
<!-- Authenticator Option -->
<button class="method-card w-full p-4 flex items-center gap-4 rounded-2xl border border-outline-variant/30 bg-surface-container-lowest hover:border-primary/50 transition-all group text-left" onclick="selectMethod('auth')">
<div class="w-12 h-12 rounded-xl bg-primary/5 flex items-center justify-center text-primary group-hover:bg-primary group-hover:text-white transition-colors">
<span class="material-symbols-outlined">qr_code_2</span>
</div>
<div class="flex-1">
<h3 class="font-title-lg text-body-lg font-semibold text-on-surface">Authenticator App</h3>

</div>
<span class="material-symbols-outlined text-outline-variant group-hover:text-primary transition-colors">chevron_right</span>
</button>

<div class="w-12 h-12 rounded-xl bg-secondary/5 flex items-center justify-center text-secondary group-hover:bg-secondary group-hover:text-white transition-colors">

<div class="w-12 h-12 rounded-xl bg-tertiary/5 flex items-center justify-center text-tertiary group-hover:bg-tertiary group-hover:text-white transition-colors">
<span class="material-symbols-outlined">alternate_email</span>
</div>
<div class="flex-1">

</div>
<span class="material-symbols-outlined text-outline-variant group-hover:text-primary transition-colors">chevron_right</span>
</button>

<div class="flex items-center justify-center gap-3" id="otp-container">

<input class="otp-input w-14 h-16 text-center text-2xl font-bold rounded-2xl border border-outline-variant bg-surface-container-lowest focus:border-primary focus:outline-none transition-all" maxlength="1" type="text"/>
<input class="otp-input w-14 h-16 text-center text-2xl font-bold rounded-2xl border border-outline-variant bg-surface-container-lowest focus:border-primary focus:outline-none transition-all" maxlength="1" type="text"/>
<input class="otp-input w-14 h-16 text-center text-2xl font-bold rounded-2xl border border-outline-variant bg-surface-container-lowest focus:border-primary focus:outline-none transition-all" maxlength="1" type="text"/>

<!-- Visual Polish: Background Mesh -->
<div class="fixed inset-0 -z-10 overflow-hidden pointer-events-none">
<div class="absolute top-[-10%] left-[-10%] w-[40%] h-[40%] rounded-full bg-primary/5 blur-[120px]"></div>
<div class="absolute bottom-[-10%] right-[-10%] w-[50%] h-[50%] rounded-full bg-secondary/5 blur-[120px]"></div>
</div>
<script>
        function selectMethod(method) {
            const selector = document.getElementById('method-selector');
            const verifier = document.getElementById('verification-step');
            
            selector.classList.add('hidden');
            verifier.classList.remove('hidden');

            // Set specific focus/context if needed
            console.log('Method selected:', method);
        }

        function resetFlow() {
            const selector = document.getElementById('method-selector');
            const verifier = document.getElementById('verification-step');
            
            verifier.classList.add('hidden');
            selector.classList.remove('hidden');
        }

        // OTP Input Auto-focus logic
        const inputs = document.querySelectorAll('.otp-input');
        inputs.forEach((input, index) => {
            input.addEventListener('input', (e) => {
                if (e.target.value.length === 1 && index < inputs.length - 1) {
                    inputs[index + 1].focus();
                }
            });
            input.addEventListener('keydown', (e) => {
                if (e.key === 'Backspace' && !e.target.value && index > 0) {
                    inputs[index - 1].focus();
                }
            });
        });
    </script>
