<script>
        // Interactive Elements Logic
        const fontSizeSlider = document.getElementById('fontSizeSlider');
        const fontSizeLabel = document.getElementById('fontSizeLabel');
        const previewText = document.getElementById('previewText');

        fontSizeSlider.addEventListener('input', (e) => {
            const val = e.target.value;
            fontSizeLabel.textContent = `${val}px`;
            previewText.style.fontSize = `${val}px`;
            previewText.parentElement.parentElement.querySelectorAll('p').forEach(p => {
                p.style.fontSize = `${val}px`;
            });
        });

        function setTheme(mode) {
            const html = document.documentElement;
            const buttons = document.querySelectorAll('.theme-toggle');
            
            buttons.forEach(btn => {
                btn.classList.remove('border-primary/40');
                btn.classList.add('border-transparent');
                if (btn.getAttribute('data-mode') === mode) {
                    btn.classList.remove('border-transparent');
                    btn.classList.add('border-primary/40');
                }
            });

            if (mode === 'dark') {
                html.classList.add('dark');
            } else if (mode === 'light') {
                html.classList.remove('dark');
            } else {
                // System Preference
                if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
                    html.classList.add('dark');
                } else {
                    html.classList.remove('dark');
                }
            }
        }

        // Handle Active Selection Visuals for Accent Colors
        const colorButtons = document.querySelectorAll('button.rounded-full.w-10');
        colorButtons.forEach(btn => {
            btn.addEventListener('click', () => {
                colorButtons.forEach(b => {
                    b.classList.remove('ring-2', 'ring-primary', 'border-white');
                    b.classList.add('border-transparent');
                });
                btn.classList.add('ring-2', 'ring-primary', 'border-white');
                btn.classList.remove('border-transparent');
            });
        });

        // Initialize with default states
        setTheme('system');
    </script>
