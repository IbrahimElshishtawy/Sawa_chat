<script>
        function createConfetti() {
            const container = document.getElementById('confetti-container');
            const colors = ['#004ac6', '#00687a', '#4ae176', '#57dffe', '#ffdad6', '#ffd700'];
            
            for (let i = 0; i < 60; i++) {
                const confetti = document.createElement('div');
                confetti.classList.add('confetti-piece');
                
                const size = Math.random() * 8 + 4 + 'px';
                confetti.style.width = size;
                confetti.style.height = size;
                confetti.style.left = Math.random() * 100 + 'vw';
                confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                confetti.style.animationDuration = Math.random() * 3 + 2 + 's';
                confetti.style.animationDelay = Math.random() * 2 + 's';
                confetti.style.transform = `rotate(${Math.random() * 360}deg)`;
                
                container.appendChild(confetti);
                
                // Remove confetti after animation finishes to keep DOM clean
                setTimeout(() => {
                    confetti.remove();
                }, 5000);
            }
        }

        // Trigger confetti on load
        window.addEventListener('load', () => {
            createConfetti();
            // Optional: Re-trigger confetti periodically for energy
            setInterval(createConfetti, 4000);
        });

        function handleContinue() {
            // Visual feedback before navigation
            const btn = event.currentTarget;
            btn.innerHTML = '<span class="material-symbols-outlined animate-spin">progress_activity</span>';
            setTimeout(() => {
                console.log('Navigating to dashboard...');
                // In a real app: window.location.href = '/dashboard';
            }, 800);
        }
    </script>
