<style>

        }
        
        .strength-bar-fill {

        }

            color: #004ac6;
        }

        .floating-label-input label {
            transition: all 0.2s ease-out;
        }

        @keyframes subtle-float {
            0%, 100% { transform: translateY(0); }

    body {
      min-height: max(884px, 100dvh);

<body class="bg-surface-container-lowest min-h-screen flex flex-col font-body-md text-on-surface">
<header class="fixed top-0 left-0 w-full z-50 flex justify-between items-center px-container-mobile h-16 bg-surface/80 backdrop-blur-xl shadow-sm">
<div class="flex items-center gap-4">
<button class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-surface-variant/20 transition-colors active:scale-95">
<span class="material-symbols-outlined text-primary">arrow_back</span>
</button>
<span class="text-title-lg font-title-lg font-bold text-primary">Sawa</span>
</div>
<div class="flex items-center gap-3">
<span class="material-symbols-outlined text-outline">help_outline</span>
</div>
</header>
<main class="flex-grow flex items-center justify-center px-container-mobile pt-24 pb-12 overflow-hidden relative">
<div class="absolute inset-0 pointer-events-none opacity-20 overflow-hidden">
<div class="absolute -top-24 -left-24 w-96 h-96 bg-primary rounded-full blur-[120px]"></div>
<div class="absolute -bottom-24 -right-24 w-96 h-96 bg-secondary rounded-full blur-[120px]"></div>
</div>
<div class="w-full max-w-md z-10">
<div class="mb-stack-gap-lg">
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface mb-2">Reset Password</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Your new password must be different from previous passwords.</p>
</div>
<div class="space-y-stack-gap-lg glass-panel p-6 rounded-[28px] shadow-sm border border-outline-variant/10">
<div class="space-y-stack-gap-md">
<div class="relative flex flex-col group">
<label class="font-label-md text-label-md text-outline mb-2 group-focus-within:text-primary transition-colors">New Password</label>
<div class="relative">
<input class="w-full h-14 bg-surface-container-low border border-outline-variant rounded-xl px-4 pr-12 focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-all placeholder:text-outline-variant" id="newPassword" placeholder="Enter password" type="password">
<button class="absolute right-4 top-1/2 -translate-y-1/2 text-outline hover:text-primary transition-colors" onclick="toggleVisibility('newPassword', 'newPasswordIcon')" type="button">
<span class="material-symbols-outlined" id="newPasswordIcon">visibility</span>
</button>
</div>
</div>
<div class="pt-2">
<div class="flex justify-between items-center mb-2">
<span class="font-label-sm text-label-sm text-outline">Password Strength</span>
<span class="font-label-sm text-label-sm text-error font-bold" id="strengthLabel">Weak</span>
</div>
<div class="h-1.5 w-full bg-surface-container rounded-full overflow-hidden">
<div class="h-full w-0 strength-bar-fill bg-error rounded-full" id="strengthBar"></div>
</div>
<p class="font-label-sm text-label-sm text-outline-variant mt-2 leading-relaxed">
                            Use 8 or more characters with a mix of letters, numbers &amp; symbols.
                        </p>
</div>
<div class="relative flex flex-col group">
<label class="font-label-md text-label-md text-outline mb-2 group-focus-within:text-primary transition-colors">Confirm Password</label>
<div class="relative">
<input class="w-full h-14 bg-surface-container-low border border-outline-variant rounded-xl px-4 pr-12 focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-all placeholder:text-outline-variant" id="confirmPassword" placeholder="Confirm password" type="password">
<button class="absolute right-4 top-1/2 -translate-y-1/2 text-outline hover:text-primary transition-colors" onclick="toggleVisibility('confirmPassword', 'confirmPasswordIcon')" type="button">
<span class="material-symbols-outlined" id="confirmPasswordIcon">visibility</span>
</button>
</div>
</div>
</div>
<div class="pt-stack-gap-md">
<button class="w-full h-14 primary-gradient text-on-primary font-title-lg text-title-lg rounded-full shadow-lg hover:opacity-90 active:scale-95 transition-all duration-200 flex items-center justify-center gap-2 group">
                        Save
                        <span class="material-symbols-outlined group-hover:translate-x-1 transition-transform">arrow_forward</span>
</button>
</div>
</div>
<div class="mt-stack-gap-lg flex justify-center items-center gap-2">
<span class="font-body-md text-body-md text-outline">Remembered your password?</span>
<a class="font-body-md text-body-md text-primary font-semibold hover:underline" href="#">Log in</a>
</div>
</div>
</main>
<footer class="md:hidden">
</footer>
<script>
        function toggleVisibility(inputId, iconId) {
            const input = document.getElementById(inputId);
            const icon = document.getElementById(iconId);
            if (input.type === "password") {
                input.type = "text";
                icon.innerText = "visibility_off";
            } else {
                input.type = "password";
                icon.innerText = "visibility";
            }
        }

        const newPasswordInput = document.getElementById('newPassword');
        const strengthBar = document.getElementById('strengthBar');
        const strengthLabel = document.getElementById('strengthLabel');

        newPasswordInput.addEventListener('input', function() {
            const val = this.value;
            let score = 0;
            
            if (val.length >= 8) score++;
            if (/[A-Z]/.test(val)) score++;
            if (/[0-9]/.test(val)) score++;
            if (/[^A-Za-z0-9]/.test(val)) score++;

            let width = '0%';
            let colorClass = 'bg-error';
            let label = 'Weak';
            let labelColor = 'text-error';

            if (val.length === 0) {
                width = '0%';
            } else if (score <= 1) {
                width = '25%';
                colorClass = 'bg-error';
                label = 'Weak';
                labelColor = 'text-error';
            } else if (score === 2) {
                width = '50%';
                colorClass = 'bg-[#ffca28]'; // Yellow using fallback color for strength meter
                label = 'Fair';
                labelColor = 'text-[#ffca28]';
            } else if (score === 3) {
                width = '75%';
                colorClass = 'bg-tertiary-container';
                label = 'Strong';
                labelColor = 'text-tertiary-container';
            } else if (score >= 4) {
                width = '100%';
                colorClass = 'bg-tertiary-fixed-dim';
                label = 'Excellent';
                labelColor = 'text-tertiary-fixed-dim';
            }

            strengthBar.style.width = width;
            strengthBar.className = `h-full strength-bar-fill rounded-full ${colorClass}`;
            strengthLabel.innerText = label;
            strengthLabel.className = `font-label-sm text-label-sm font-bold ${labelColor}`;
        });
    </script>
</body></html>
