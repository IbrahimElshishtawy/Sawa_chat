<!-- Selection Interaction Script -->
<script>
        document.querySelectorAll('.language-card').forEach(card => {
            card.addEventListener('click', () => {
                // Find all cards and reset UI
                document.querySelectorAll('.radio-ui').forEach(ui => {
                    ui.classList.remove('border-primary', 'bg-primary');
                });
                
                // Set current card active UI
                const radioUi = card.querySelector('.radio-ui');
                radioUi.classList.add('border-primary', 'bg-primary');
                
                // Add a small animation effect
                card.style.transform = 'scale(0.98)';
                setTimeout(() => {
                    card.style.transform = 'scale(1)';
                }, 100);
            });
        });
