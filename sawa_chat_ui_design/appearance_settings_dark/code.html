<script>
    const fontSizeSlider = document.getElementById('fontSizeSlider');
    const fontSizeLabel = document.getElementById('fontSizeLabel');
    const previewText = document.getElementById('previewText');

    fontSizeSlider.addEventListener('input', (e) => {
        const val = e.target.value;
        fontSizeLabel.textContent = `${val}px`;
        previewText.style.fontSize = `${val}px`;
        previewText.parentElement.parentElement.parentElement.querySelectorAll('p').forEach(p => {
            p.style.fontSize = `${val}px`;
        });
    });

    function setTheme(mode) {
        const html = document.documentElement;
        const buttons = document.querySelectorAll('.theme-toggle');
        
        buttons.forEach(btn => {
            btn.classList.remove('border-primary/60');
            btn.classList.add('border-transparent');
            const span = btn.querySelector('span:not(.material-symbols-outlined)');
            if (span) span.classList.remove('text-white', 'font-bold');
            if (span) span.classList.add('text-on-surface-variant');

            if (btn.getAttribute('data-mode') === mode) {
                btn.classList.remove('border-transparent');
                btn.classList.add('border-primary/60');
                if (span) {
                    span.classList.remove('text-on-surface-variant');
                    span.classList.add('text-white', 'font-bold');
                }
            }
        });

        // Forced dark mode as per user request, but maintaining logic if they click
        if (mode === 'light') {
            html.classList.remove('dark');
        } else {
            html.classList.add('dark');
        }
    }

    const colorButtons = document.querySelectorAll('button.rounded-full.w-10');
    colorButtons.forEach(btn => {
        btn.addEventListener('click', () => {
            colorButtons.forEach(b => {
                b.classList.remove('ring-2', 'ring-primary', 'border-[#0b1c30]');
                b.classList.add('border-transparent');
            });
            btn.classList.add('ring-2', 'ring-primary', 'border-[#0b1c30]');
            btn.classList.remove('border-transparent');
        });
    });

    // Default to Dark Mode as per request
    setTheme('dark');
</script>
