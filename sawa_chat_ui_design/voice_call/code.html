<script>
        // Simple timer logic
        let seconds = 252; // Starting at 04:12 for demonstration
        const timerElement = document.getElementById('call-timer');

        function updateTimer() {
            seconds++;
            const mins = Math.floor(seconds / 60);
            const secs = seconds % 60;
            timerElement.textContent = `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
        }

        setInterval(updateTimer, 1000);

        // Simulated haptic feedback on button presses
        document.querySelectorAll('button').forEach(btn => {
            btn.addEventListener('click', () => {
                if ('vibrate' in navigator) {
                    navigator.vibrate(10);
                }
            });
        });

        // Toggle state for controls
        document.querySelectorAll('.interaction-press').forEach(btn => {
            btn.addEventListener('click', function() {
                const iconContainer = this.querySelector('div');
                if(iconContainer && !this.classList.contains('bg-error')) {
                    iconContainer.classList.toggle('bg-white/40');
                    iconContainer.classList.toggle('bg-white/10');
                }
            });
        });
    </script>
