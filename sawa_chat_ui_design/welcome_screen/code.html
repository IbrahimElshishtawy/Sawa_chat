<style>

      }
      
      .btn-hover-effect:active {

      }

      /* Subtle floating animation for the hero image */

        0%, 100% { transform: translateY(0px); }

<body class="bg-surface text-on-surface font-body-md selection:bg-primary-container selection:text-on-primary-container">
<!-- Header (Suppressed navigation as per task requirements for welcome/onboarding) -->

</header>
<main class="relative min-h-screen flex flex-col items-center justify-center px-container-mobile pt-20 pb-12 overflow-hidden">
<!-- Background Atmospheric Element -->
<div class="absolute top-1/4 -right-24 w-96 h-96 bg-primary-container/10 rounded-full blur-[120px] pointer-events-none"></div>
<div class="absolute -bottom-24 -left-24 w-80 h-80 bg-secondary-container/20 rounded-full blur-[100px] pointer-events-none"></div>
<!-- 3D Illustration Container -->
<div class="relative w-full max-w-sm aspect-square mb-stack-gap-lg flex items-center justify-center">
<div class="animate-float w-full h-full relative z-10">
<img class="w-full h-full object-contain" data-alt="A premium 3D isometric illustration of a floating glass globe representing global connection. Intricate glowing network lines wrap around the sphere, with translucent chat bubbles and social icons floating nearby. The style is hyper-clean and minimalist with soft claymorphism textures, featuring a professional color palette of bright blues, soft teals, and pristine white. The lighting is soft and cinematic, creating a sense of sophisticated technological harmony." src="https://lh3.googleusercontent.com/aida-public/AB6AXuC5HbfwXLWiNg4pGJlhCdXWxkVxmGpDz4Fv5ZNE1fFNrKSVQ5BagyNpIAkj7ILbGcAjqcq5y9O7iR4mwE_UbwojPp5JOdgrgf3tNTcATnL-WaZAhmXkN3fc-IlpRKDHHsen7_CKvGqT6gqsZR26LY34jDVjT6VQpIkFgFMCD26rgqk77nYONeo9Ohoco5vJKJQuiNfV8FR1PKbmjbBerXI9cNzsUqAwEFhma7dz1ZQ7LrNH936U-DktRNSfpj5x8WskxXtOAPMS3jQ">
</div>
<!-- Decorative ring behind illustration -->
<div class="absolute inset-0 rounded-full border-[1.5px] border-primary/5 scale-125 pointer-events-none"></div>
<div class="absolute inset-0 rounded-full border-[1px] border-secondary/10 scale-110 pointer-events-none"></div>
</div>
<!-- Content Area -->
<div class="text-center space-y-stack-gap-sm max-w-md z-10">
<h1 class="font-headline-lg-mobile text-headline-lg-mobile md:font-headline-lg md:text-headline-lg text-on-surface tracking-tight">
                Welcome to Sawa Chat
            </h1>
<p class="font-body-lg text-body-lg text-on-surface-variant px-4">
                Everything you need in one place.
            </p>
</div>
<!-- Action Buttons -->
<div class="w-full max-w-sm mt-stack-gap-lg space-y-4 z-10 px-4">
<button class="btn-hover-effect w-full h-14 rounded-full bg-gradient-to-r from-primary to-primary-container text-on-primary font-title-lg text-title-lg flex items-center justify-center shadow-lg shadow-primary/20">
                Continue
            </button>
<button class="btn-hover-effect w-full h-14 rounded-full border-[1.5px] border-outline-variant text-primary font-title-lg text-title-lg flex items-center justify-center hover:bg-surface-variant/20 transition-colors">
                Already have an account
            </button>
</div>
<!-- Language Selector Footer -->
<footer class="mt-auto pt-12 pb-safe w-full flex justify-center z-10">
<div class="relative group">
<button class="flex items-center gap-2 px-4 py-2 rounded-full hover:bg-surface-variant/30 transition-all text-on-surface-variant font-label-md text-label-md" id="langSelector">
<span class="material-symbols-outlined text-[20px]" data-icon="language">language</span>
<span>English (US)</span>
<span class="material-symbols-outlined text-[18px]" data-icon="expand_more">expand_more</span>
</button>
<!-- Dropdown Menu (Hidden by default) -->
<div class="absolute bottom-full left-1/2 -translate-x-1/2 mb-2 w-48 glass-card border border-outline-variant/10 rounded-2xl shadow-xl py-2 opacity-0 translate-y-4 pointer-events-none transition-all duration-300" id="langDropdown">
<div class="px-4 py-2 hover:bg-primary-container/10 text-primary cursor-pointer font-label-md">English (US)</div>
<div class="px-4 py-2 hover:bg-primary-container/10 text-on-surface-variant cursor-pointer font-label-md">العربية</div>
<div class="px-4 py-2 hover:bg-primary-container/10 text-on-surface-variant cursor-pointer font-label-md">Français</div>
<div class="px-4 py-2 hover:bg-primary-container/10 text-on-surface-variant cursor-pointer font-label-md">Español</div>

</main>
<!-- JavaScript for Interactions -->
<script>
        const langBtn = document.getElementById('langSelector');
        const langDropdown = document.getElementById('langDropdown');
        let isDropdownOpen = false;

        langBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            isDropdownOpen = !isDropdownOpen;
            if (isDropdownOpen) {
                langDropdown.classList.remove('opacity-0', 'translate-y-4', 'pointer-events-none');
                langDropdown.classList.add('opacity-100', 'translate-y-0');
            } else {
                langDropdown.classList.add('opacity-0', 'translate-y-4', 'pointer-events-none');
                langDropdown.classList.remove('opacity-100', 'translate-y-0');
            }
        });

        document.addEventListener('click', () => {
            if (isDropdownOpen) {
                langDropdown.classList.add('opacity-0', 'translate-y-4', 'pointer-events-none');
                langDropdown.classList.remove('opacity-100', 'translate-y-0');
                isDropdownOpen = false;
            }
        });

        // Basic button feedback logic
        const buttons = document.querySelectorAll('.btn-hover-effect');
        buttons.forEach(btn => {
            btn.addEventListener('mouseenter', () => {
                btn.style.filter = 'brightness(1.05)';
            });
            btn.addEventListener('mouseleave', () => {
                btn.style.filter = 'brightness(1)';
            });
        });
    </script>
