<input class="otp-input w-12 h-14 md:w-14 md:h-16 text-center text-title-lg font-title-lg bg-surface-container-low border-none rounded-xl focus:ring-0 outline-none" inputmode="numeric" maxlength="1" type="text">
<input class="otp-input w-12 h-14 md:w-14 md:h-16 text-center text-title-lg font-title-lg bg-surface-container-low border-none rounded-xl focus:ring-0 outline-none" inputmode="numeric" maxlength="1" type="text">

<!-- Interactive Script for OTP Flow -->
<script>
        const inputs = document.querySelectorAll('.otp-input');
        const countdownEl = document.getElementById('countdown');
        const resendBtn = document.getElementById('resend-btn');

        // Handle OTP Input focus shifting
        inputs.forEach((input, index) => {
            input.addEventListener('keyup', (e) => {
                if (e.key >= 0 && e.key <= 9) {
                    if (index < inputs.length - 1) {
                        inputs[index + 1].focus();
                    }
                } else if (e.key === 'Backspace') {
                    if (index > 0) {
                        inputs[index - 1].focus();
                    }
                }
            });

            // Prevent non-numeric characters
            input.addEventListener('input', (e) => {
                e.target.value = e.target.value.replace(/[^0-9]/g, '');
            });
        });

        // Simple Countdown Timer
        let timeLeft = 59;
        const timer = setInterval(() => {
            if (timeLeft <= 0) {
                clearInterval(timer);
                countdownEl.classList.add('hidden');
                resendBtn.disabled = false;
                resendBtn.classList.remove('text-outline');
                resendBtn.classList.add('text-primary', 'font-bold', 'hover:opacity-80');
            } else {
                let seconds = timeLeft < 10 ? '0' + timeLeft : timeLeft;
                countdownEl.textContent = `00:${seconds}`;
                timeLeft--;
            }
        }, 1000);

        // Micro-interaction: Visual feedback on verify press
        const verifyBtn = document.querySelector('button.bg-gradient-to-r');
        verifyBtn.addEventListener('click', () => {
            const code = Array.from(inputs).map(i => i.value).join('');
            if (code.length === 6) {
                verifyBtn.innerHTML = `<span class="material-symbols-outlined animate-spin">progress_activity</span>`;
                setTimeout(() => {
                    verifyBtn.innerHTML = `<span class="material-symbols-outlined">check_circle</span> Verified`;
                    verifyBtn.classList.remove('from-primary', 'to-primary-container');
                    verifyBtn.classList.add('bg-tertiary-container');
                }, 1500);
            }
        });
    </script>
