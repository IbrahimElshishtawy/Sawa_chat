<body class="bg-background text-on-background mesh-bg min-h-screen flex flex-col items-center justify-start overflow-x-hidden">
<!-- Top Navigation Header (Suppressed Shell, manual implementation for task focus) -->
<header class="fixed top-0 left-0 w-full z-50 flex items-center px-container-mobile h-16 pointer-events-none">
<button class="pointer-events-auto w-10 h-10 flex items-center justify-center rounded-full bg-surface-container-low/80 backdrop-blur-md text-primary hover:bg-surface-container-high transition-all active:scale-90 shadow-sm" onclick="window.history.back()">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">arrow_back</span>
</button>
</header>
<main class="w-full max-w-md px-container-mobile pt-24 pb-12 flex flex-col min-h-screen">
<!-- Headline Section -->
<div class="mb-stack-gap-lg">
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-primary mb-2">Forgot Password?</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Enter your email or phone number to reset your password.</p>
</div>
<!-- Visual Anchor: Abstract 3D Illustration -->
<div class="flex-grow flex items-center justify-center py-stack-gap-lg overflow-hidden">
<div class="relative w-64 h-64 md:w-80 md:h-80 floating-anim flex items-center justify-center">
<!-- Background decorative element -->
<div class="absolute inset-0 bg-primary-container/10 rounded-full blur-3xl scale-125"></div>
<!-- Main 3D Illustration -->
<div class="relative z-10 w-full h-full bg-cover bg-center rounded-full shadow-2xl border-4 border-white/40 glass-effect flex items-center justify-center" data-alt="A soft and sophisticated 3D abstract digital illustration of a fluid, translucent floating orb with iridescent highlights. The sphere is surrounded by delicate crystalline shards and soft-glowing ethereal ribbons of light in primary blue and teal gradients. The aesthetic is clean, minimalist, and premium, set against a bright, airy light-mode background with soft volumetric lighting and a sense of weightless serenity." style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuDtHMdPGSrKL6MiBry5t8HDS1hA6RUQ9DYuxwcV9jIOqyQntYV8QW-1KGOvJFq9qB20t0j_WzLsX-tPwP2yNlk-BeRQUMmIiuKmiJ17GUYTso7pNoKVXH44hzEES-Qx6-2o3YlebJdYPUryIAkCv-ihAGmqYEL3B0QOcIjHti65rlTWYpUk0RFDD9VHk-5xgSauj2usaBuVutTAl0Or7Zfew8EOo77S5hgVFv9jK22-c597BPxr6d9OYbS-BHcbUE78laFTFlO7Ktw')">
<!-- Fallback if image fails, a glassmorphic shield icon or similar could be here -->
</div>
<!-- Floating chips for extra depth -->
<div class="absolute -top-4 -right-2 bg-white/80 backdrop-blur shadow-lg rounded-2xl px-4 py-2 border border-white/50 animate-bounce" style="animation-duration: 4s;">
<span class="material-symbols-outlined text-primary" style="font-variation-settings: 'FILL' 1;">security</span>
</div>
<div class="absolute bottom-4 -left-6 bg-white/80 backdrop-blur shadow-lg rounded-2xl px-4 py-2 border border-white/50 animate-pulse" style="animation-duration: 5s;">
<span class="material-symbols-outlined text-secondary" style="font-variation-settings: 'FILL' 1;">key</span>
</div>
</div>
</div>
<!-- Input & Action Section -->
<div class="mt-auto space-y-stack-gap-lg">
<!-- Form Group -->
<div class="space-y-stack-gap-sm">
<label class="font-label-md text-label-md text-on-surface-variant px-1" for="identifier">Email or Phone Number</label>
<div class="relative group">
<div class="absolute inset-y-0 left-4 flex items-center pointer-events-none text-outline group-focus-within:text-primary transition-colors">
<span class="material-symbols-outlined text-[20px]">alternate_email</span>
</div>
<input class="w-full h-14 pl-12 pr-4 rounded-[24px] bg-surface-container-low border-none focus:ring-2 focus:ring-primary/20 text-on-surface font-body-md transition-all shadow-sm" id="identifier" placeholder="hello@sawaconnect.com" type="text">
</div>
</div>
<!-- Primary Action -->
<button class="w-full h-14 bg-gradient-to-r from-primary to-primary-container text-on-primary font-title-lg text-title-lg rounded-full shadow-lg shadow-primary/20 hover:opacity-90 active:scale-[0.98] transition-all flex items-center justify-center gap-2">

<span class="material-symbols-outlined text-[20px]">arrow_forward</span>
</button>

</div>

<!-- Bottom Spacing for modern devices -->
<div class="h-8 w-full"></div>
<script>
        // Micro-interaction for the input focus
        const inputField = document.getElementById('identifier');
        const container = inputField.parentElement;

        inputField.addEventListener('focus', () => {
            container.classList.add('scale-[1.02]');
            container.style.transition = 'transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1)';
        });

        inputField.addEventListener('blur', () => {
            container.classList.remove('scale-[1.02]');
        });

        // Continue button interaction
        const continueBtn = document.querySelector('button.bg-gradient-to-r');
        continueBtn.addEventListener('click', function(e) {
            // Ripple effect or simple feedback
            const ripple = document.createElement('span');
            ripple.classList.add('absolute', 'bg-white/20', 'rounded-full', 'animate-ping');
            ripple.style.width = '100px';
            ripple.style.height = '100px';
            ripple.style.left = `${e.offsetX - 50}px`;
            ripple.style.top = `${e.offsetY - 50}px`;
            this.style.position = 'relative';
            this.style.overflow = 'hidden';
            this.appendChild(ripple);
            setTimeout(() => ripple.remove(), 600);
        });
    </script>
